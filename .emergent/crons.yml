crons:
  - name: shop-suspensions
    description: "Auto-suspends shops with unpaid commission past grace and auto-reactivates expired timed suspensions"
    cron: "0 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/process-suspensions"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: drive-backup
    description: "Uploads a full database backup to the connected Google Drive (daily or weekly per admin setting)"
    cron: "0 1 * * *"
    endpoint: "{{BASE_URL}}/api/cron/drive-backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
