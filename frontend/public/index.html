<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0E1A2B" />
        <!-- Iter 33.10 — title/description/OG tags are managed at runtime by
             react-helmet-async, sourced from admin's SEO settings in
             /api/seo/public. We keep only a bare-bones title fallback here
             so first-paint / JS-disabled visitors see a sensible label. -->
        <title>JubaSquare</title>
        <meta name="author" content="L.T.G Enterprise" />
        <!-- No default robots meta — pages set their own via react-helmet-async
             (the maintenance page uses "noindex, nofollow"; everything else is
             indexable by default, which is what search engines assume anyway.) -->

        <meta property="og:site_name" content="JubaSquare" />

        <!-- Favicons (uses the JubaSquare shopping-bag logo) -->
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
        <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />

        <!-- PWA -->
        <link rel="manifest" href="/manifest.json" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="JubaSquare" />
        <meta name="application-name" content="JubaSquare" />
        <meta name="msapplication-TileColor" content="#0E1A2B" />
        <meta name="msapplication-TileImage" content="/icons/icon-144.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <script>
          // ---- Fix benign "ResizeObserver loop completed with undelivered notifications" ----
          // Recharts (and many chart libs) resize during their own callback, which the browser
          // emits as a non-fatal error. webpack-dev-server's overlay catches it. We both wrap
          // the ResizeObserver callback in rAF (prevents the loop) AND swallow any residual events.
          (function () {
            if (typeof window === "undefined") return;
            var RO = window.ResizeObserver;
            if (RO && !RO.__patched) {
              var Patched = function (cb) {
                return new RO(function (entries, observer) {
                  window.requestAnimationFrame(function () {
                    if (!Array.isArray(entries)) return cb(entries, observer);
                    try { cb(entries, observer); } catch (e) { /* swallow */ }
                  });
                });
              };
              Patched.prototype = RO.prototype;
              Patched.__patched = true;
              window.ResizeObserver = Patched;
            }

            var re = /ResizeObserver loop (completed with undelivered notifications|limit exceeded)/;

            // Capture-phase handler: blocks webpack's overlay listener that's added later.
            window.addEventListener("error", function (e) {
              var msg = (e && (e.message || (e.error && e.error.message))) || "";
              if (re.test(msg)) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return false;
              }
            }, true);
            window.addEventListener("unhandledrejection", function (e) {
              var msg = (e && e.reason && (e.reason.message || String(e.reason))) || "";
              if (re.test(msg)) { e.stopImmediatePropagation(); e.preventDefault(); }
            }, true);

            // Block webpack-dev-server / react-error-overlay from re-adding a listener
            // that intercepts these specific errors. We wrap addEventListener so that
            // any "error" listener added by other scripts ignores ResizeObserver messages.
            var origAdd = window.addEventListener;
            window.addEventListener = function (type, listener, options) {
              if (type === "error" && typeof listener === "function" && !listener.__roSafe) {
                var wrapped = function (ev) {
                  var msg = (ev && (ev.message || (ev.error && ev.error.message))) || "";
                  if (re.test(msg)) return; // swallow for this listener
                  return listener.apply(this, arguments);
                };
                wrapped.__roSafe = true;
                return origAdd.call(this, type, wrapped, options);
              }
              return origAdd.call(this, type, listener, options);
            };
          })();
        </script>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run JubaSquare.</noscript>
        <div id="root"></div>
    </body>
</html>
